<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="index, follow">
        <title>Piscineiro - Ponta Porã / Pedro Juan Caballero</title>
        <link rel="shortcut icon" href="assets/favicon.png">

        <!-- CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.7/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
        <link rel="stylesheet" href="assets/style.css">
    </head>

    <body>
        <!-- Loading overlay -->
        <div class="loading-app">
            <i class="fas fa-circle-notch fa-spin"></i>
        </div>

        <!-- Header / Perfil -->
        <header class="perfil">
            <img id="fotoPerfil" class="foto" src="assets/fotos/perfil.webp" alt="Foto de perfil">
            <h1 id="nomePerfil">Carregando...</h1>
            <p class="local"><i class="fas fa-map-marker-alt"></i> <span id="cidadePerfil"></span></p>
            <p class="horario"><i class="fas fa-clock"></i> <span id="horarioPerfil"></span></p>
            <a id="btnWhats" href="#" class="btn-whats" target="_blank">
                <i class="fab fa-whatsapp"></i> Chamar no WhatsApp
            </a>
        </header>

        <!-- Main -->
        <main>
            <!-- Serviços -->
            <h2 class="titulo-secao"><i class="fas fa-tools"></i> Serviços</h2>
            <div id="listaServicos" class="grid-servicos"></div>

            <!-- Antes / Depois -->
            <h2 class="titulo-secao"><i class="fas fa-camera"></i> Antes e Depois</h2>
            <div id="listaAntesDepois" class="grid-antes-depois"></div>

            <!-- Formulário de orçamento -->
            <h2 class="titulo-secao"><i class="fas fa-clipboard-list"></i> Pedir orçamento</h2>
            <form id="formOrcamento" class="form-orcamento">
                <input required type="text" name="nome" placeholder="Seu nome">
                <input required type="text" name="endereco" placeholder="Endereço da piscina">
                <select required name="problema">
                    <option value="">Tipo de problema...</option>
                    <option>Água verde</option>
                    <option>Fundo com sujeira</option>
                    <option>Manutenção mensal</option>
                    <option>Outro</option>
                </select>
                <textarea name="obs" rows="3" placeholder="Observações (opcional)"></textarea>
                <button type="submit">
                    <i class="fab fa-whatsapp"></i> Enviar pelo WhatsApp
                </button>
            </form>
        </main>

        <!-- Rodapé com redes sociais -->
        <footer>
            <div class="redes-sociais">
                <a href="https://www.instagram.com/" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.facebook.com/" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="https://www.tiktok.com/" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.linkedin.com/in/joilsonic/" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
            <p>Piscineiro em Ponta Porã e Pedro Juan Caballero • <span id="ano"></span></p>
        </footer>

        <!-- JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>
        <script src="assets/scripts.js"></script>
    </body>

</html>
